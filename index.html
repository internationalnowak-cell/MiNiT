<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiNiT.betting — Betting as Investment</title>
<meta name="description" content="Betting is not gambling. It is capital allocation.">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Mono:wght@400;500&family=Roboto+Condensed:wght@300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F2ED;
  --text:#111;
  --text2:#444;
  --text3:#888;
  --green:#1C5C3A;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

/* NAV */
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 48px;flex-shrink:0}
.logo-small{font-family:var(--sans);font-size:16px;font-weight:600;color:var(--green);letter-spacing:-0.02em;text-decoration:none;display:flex;align-items:center;gap:1px}
.logo-small-dot{width:5px;height:5px;background:var(--green);border-radius:1px;display:inline-block;margin:0 1px 2px}
.logo-small-bet{font-weight:300;color:var(--text2)}
.nav-links{display:flex;gap:28px}
.nav-link{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);text-decoration:none;transition:color .15s}
.nav-link:hover{color:var(--text)}

/* HERO */
.hero{
  flex:1;
  display:grid;
  grid-template-columns:42% 36% 22%;
  min-height:0;
  padding:0 48px;
  gap:0;
}

/* LEFT — editorial */
.hero-left{
  display:flex;flex-direction:column;justify-content:center;
  padding-right:48px;min-height:0;
}
.ed-headline{
  font-family:var(--serif);
  font-size:clamp(36px,4.8vw,64px);
  line-height:1.05;letter-spacing:-0.03em;
  color:var(--text);margin-bottom:clamp(20px,2.5vh,32px);
}
.ed-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:500px}
.ed-col-label{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:9px;display:block}
.ed-col{font-size:13px;color:var(--text2);line-height:1.8;font-weight:300}

/* MIDDLE — chart */
.hero-mid{
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:0 24px;
  min-height:0;
}
.chart-label{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:16px;text-align:center}
.chart-svg{width:100%;max-width:420px;flex-shrink:0}

/* RIGHT — stencil */
.hero-right{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-left:16px;min-height:0;
}
.stencil-svg{width:clamp(110px,13vw,185px);opacity:0.75;flex-shrink:0}
.stencil-caption{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:0.06em;text-align:center;margin-top:12px;line-height:1.7}

/* THESES */
.theses{
  flex-shrink:0;
  display:grid;grid-template-columns:1fr 1fr 1fr;
  padding:clamp(20px,2.8vh,36px) 48px;
  gap:48px;
}
.th-header{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.th-num{font-family:var(--mono);font-size:10px;color:var(--green);letter-spacing:0.04em;flex-shrink:0}
.th-label{font-family:var(--mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);font-weight:500}
.th-title{font-family:var(--serif);font-size:clamp(16px,1.4vw,20px);line-height:1.25;color:var(--text);margin-bottom:8px}
.th-title em{font-style:italic}
.th-body{font-size:clamp(12.5px,1vw,14px);color:var(--text2);line-height:1.75;font-weight:300;margin-bottom:8px}
.th-rule{font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.5}

/* MOBILE */
@media (max-width:768px){
  html,body{overflow:auto;height:auto}
  nav{padding:14px 20px}
  .nav-links{gap:16px}
  .nav-link{font-size:9px}

  .hero{
    grid-template-columns:1fr;
    padding:0 20px;
    gap:0;
    flex:none;
  }
  .hero-left{
    padding-right:0;
    padding-top:32px;
    padding-bottom:32px;
    justify-content:flex-start;
  }
  .ed-headline{font-size:clamp(32px,9vw,48px);margin-bottom:20px}
  .ed-cols{grid-template-columns:1fr 1fr;gap:20px}
  .ed-col{font-size:13px}

  .hero-mid{
    padding:28px 0;
    align-items:flex-start;
  }
  .chart-svg{max-width:100%}

  .hero-right{
    padding-left:0;
    padding-bottom:36px;
    flex-direction:row;
    align-items:center;
    gap:20px;
    justify-content:flex-start;
  }
  .stencil-svg{width:clamp(80px,22vw,120px)}
  .stencil-caption{text-align:left;margin-top:0;font-size:12px}

  .theses{
    grid-template-columns:1fr;
    padding:28px 20px 40px;
    gap:32px;
  }
  .th-title{font-size:18px}
  .th-body{font-size:13.5px}
}

@media (max-width:480px){
  .ed-cols{grid-template-columns:1fr}
  .nav-links{gap:12px}
}
</head>
<body>

<nav>
  <a href="/" class="logo-small">MiNiT<span class="logo-small-dot"></span><span class="logo-small-bet">.betting</span></a>
  <div class="nav-links">
    <a href="framework.html" class="nav-link">The Framework</a>
    <a href="psychology.html" class="nav-link">Psychology</a>
    <a href="numbers.html" class="nav-link">By the Numbers</a>
    <a href="glossary.html" class="nav-link">Glossary</a>
  </div>
</nav>

<div class="hero">

  <!-- LEFT -->
  <div class="hero-left">
    <div class="ed-headline">The Market<br>Is Always Right.</div>
    <div class="ed-cols">
      <div>
        <span class="ed-col-label">The illusion</span>
        <p class="ed-col">Until it isn't. And when it isn't, that is precisely where the edge lives — in the gap between public sentiment and true probability.</p>
      </div>
      <div>
        <span class="ed-col-label">The reality</span>
        <p class="ed-col">Professional participants don't predict outcomes. They identify mispriced expectations and act with discipline across large sample sizes.</p>
      </div>
    </div>
  </div>

  <!-- MIDDLE — convergence chart -->
  <div class="hero-mid">
    <div class="chart-label">Edge emerges over time</div>
    <svg class="chart-svg" viewBox="0 0 280 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="24" y1="130" x2="268" y2="130" stroke="#D8D4CB" stroke-width="0.5"/>
      <line x1="24" y1="12" x2="24" y2="130" stroke="#D8D4CB" stroke-width="0.5"/>
      <line x1="24" y1="72" x2="268" y2="72" stroke="#1C5C3A" stroke-width="0.7" stroke-dasharray="4 3" opacity="0.5"/>
      <text x="270" y="75" font-family="'DM Mono',monospace" font-size="7" fill="#1C5C3A" opacity="0.7">true EV</text>
      <!-- chaotic line converging -->
      <path d="M24 72 L34 28 L44 115 L54 22 L64 118 L74 34 L84 105 L93 42 L102 100 L110 50 L118 92 L125 58 L132 85 L138 63 L144 80 L150 67 L156 77 L162 70 L168 75 L174 71 L180 73 L188 72 L200 72 L220 72 L250 72 L268 72"
            fill="none" stroke="#111" stroke-width="1.1" opacity="0.6" stroke-linejoin="round"/>
      <!-- early noise shading -->
      <path d="M24 38 Q80 28 130 58 Q155 66 175 70 L175 74 Q155 78 130 86 Q80 116 24 106Z"
            fill="#111" opacity="0.04"/>
      <!-- x labels -->
      <text x="24" y="143" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#bbb">0</text>
      <text x="104" y="143" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#bbb">100</text>
      <text x="184" y="143" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#bbb">300</text>
      <text x="264" y="143" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#1C5C3A">500+</text>
      <!-- zone labels -->
      <text x="56" y="18" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#ccc" letter-spacing="0.06em">NOISE</text>
      <text x="148" y="18" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#aaa" letter-spacing="0.06em">SIGNAL</text>
      <text x="232" y="18" text-anchor="middle" font-family="'DM Mono',monospace" font-size="7" fill="#1C5C3A" letter-spacing="0.06em">EDGE</text>
    </svg>
  </div>

  <!-- RIGHT — stencil -->
  <div class="hero-right">
    <svg class="stencil-svg" viewBox="0 0 280 250" xmlns="http://www.w3.org/2000/svg">
      <polygon points="140,8 268,232 12,232" fill="#C0392B"/>
      <text x="140" y="188" text-anchor="middle" font-family="'Roboto Condensed',sans-serif" font-size="112" font-weight="300" fill="#F4F2ED">!</text>
      <text x="140" y="218" text-anchor="middle" font-family="'Roboto Condensed',sans-serif" font-size="12" font-weight="300" fill="#F4F2ED" letter-spacing="0.3em">VARIANCE</text>
    </svg>
    <div class="stencil-caption">even a 5% edge<br>produces 30-bet losing runs</div>
  </div>

</div>

<div class="theses">
  <div>
    <div class="th-header"><span class="th-num">01</span><span class="th-label">The Thesis</span></div>
    <div class="th-title">Markets are <em>inefficient.</em> That is the edge.</div>
    <p class="th-body">Bookmakers set prices based on public sentiment, liability management and volume — not purely on probability. Where their model is wrong, an informed participant with superior data holds a structural advantage.</p>
    <div class="th-rule">Expected Value = (Probability × Odds) − 1</div>
  </div>
  <div>
    <div class="th-header"><span class="th-num">02</span><span class="th-label">The Discipline</span></div>
    <div class="th-title">Process is the only <em>moat.</em></div>
    <p class="th-body">Short-term results are noise. The investor's advantage emerges only across large sample sizes. A losing month with correct process is success. A winning month with incorrect process is a liability.</p>
    <div class="th-rule">Track every decision. Judge the process, not the outcome.</div>
  </div>
  <div>
    <div class="th-header"><span class="th-num">03</span><span class="th-label">The Risk</span></div>
    <div class="th-title">Variance will <em>test</em> you.</div>
    <p class="th-body">Even a 5% edge produces losing runs of 20, 30, or 50 bets. Without understanding variance, a sound strategy gets abandoned at exactly the wrong moment. Kelly Criterion exists for one reason: to keep you in the game.</p>
    <div class="th-rule">Ruin is permanent. Drawdown is temporary.</div>
  </div>
</div>

</body>
